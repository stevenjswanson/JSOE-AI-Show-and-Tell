# GitHub Pages builds this repo with Jekyll. index.html is generated by scripts/build.py and
# has no front matter, so Jekyll copies it as is. Jekyll renders only status/index.html,
# from _data/status/*.yml (see runbook/RUNBOOK.md §7).

title: Jacobs School of Engineering AI Show and Tell
exclude:
  - README.md
  - CLAUDE.md
  - config.toml
  - runbook/
  - scripts/
  - sessions/
  - templates/
  - email-archive/
  - Gemfile
  - Gemfile.lock
  - vendor/
