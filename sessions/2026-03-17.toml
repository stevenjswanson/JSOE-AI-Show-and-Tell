[[talks]]
presenter = "Craig Zilles"
title = "Writing PrairieLearn Questions and Computer-Based Testing Practices"
summary = """
Dr. Zilles demonstrated PrairieLearn, a platform that supports parameterized question generators, \
automatic grading, and a browser-based exam environment built on an existing library of question \
elements. He covered mixed auto/manual grading workflows, an emerging AI-assisted grading feature, \
and a “no code” interface for authoring questions, and described how his group has used these tools \
to shift homework and exams from paper to fully computer-based formats."""

