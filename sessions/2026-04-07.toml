[[talks]]
presenter = "Joe Politz"
title = "Grading when students use GenAI for everything"
time = "12:25"
summary = """
Dr. Politz describes a grading system built around in-person “skill demonstrations” — proctored, \
step-by-step practical exams with coarse pass/fail rubrics and multiple retries — designed to give \
meaningful assessment of what students can actually do independently, in an era where \
collaboration, helpful TAs, and LLMs all confound take-home work."""

