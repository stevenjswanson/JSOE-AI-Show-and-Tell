[[talks]]
presenter = "Adalbert Gerald Soosai Raj"
title = "Human-centered teaching"
time = "12:35"
summary = """
Dr. Soosai Raj redesigned a 450-student intro programming course around handwritten, \
process-oriented homework with manual grading and small student study groups — deliberately \
putting humans back in the loop at every stage to counter the hollowing-out effect of AI tools on \
authentic learning and student community."""

