# `open` / `due` are day offsets: negative = before the event, positive = after.
# A step is "open" from E+open, "due" by E+due, "overdue" after that. `scripts/runbook.py status`
# reads this file; RUNBOOK.md explains what each step involves. Keep ids stable: state files use them.

